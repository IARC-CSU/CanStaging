stages:
    - deploy

before_script:
    - echo "Executing on `hostname`"
    - echo "Working directory is `pwd`"

deploy_staging:
    tags:
        - staging
    only:
        refs:
            - develop
    stage: deploy
    script:
        - sudo docker-compose -p CanStaging up -d --build

deploy_to_production:
    stage: deploy
    tags:
        - production
    environment: production
    only:
        refs:
            - master
    when: manual
    script:
        - sudo docker-compose -p CanStaging up -d --build
