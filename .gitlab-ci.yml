variables:
  STAGE_TAG: $CI_REGISTRY_IMAGE:staging
  #STAGE_TAG: ncrmsite:staging
  PRODUCTION_TAG: $CI_REGISTRY_IMAGE:latest
  #PRODUCTION_TAG: production
  COMMIT_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_TAG

stages:
    - deploy
    - build-image

before_script:
    - echo "Executing on `hostname`"
    - echo "Working directory is `pwd`"

deploy_staging:
    tags:
        - staging
    only:
        refs:
            - develop
    when: manual
    stage: deploy
    script:
        - sudo docker-compose -p CanStaging up -d --build

deploy_to_production:
    stage: deploy
    tags:
        - production
    environment: production
    only:
        refs:
            - master
    when: manual
    script:
        - sudo docker-compose -p CanStaging up -d --build

build_staging_image:
  stage: build-image
  image: docker:19.03-git
  tags:
      - csu-staging
  only:
      - develop
  services:
      - docker:dind
  variables:
      DOCKER_DRIVER: overlay2
      DOCKER_TLS_CERTDIR: "/certs"
  before_script:
      # Connect to your Gitlab Registry
      - "echo Registry image: ${CI_REGISTRY_IMAGE} for staging"
      - "echo docker registry is $CI_REGISTRY"
      - "docker login -u gitlab+deploy-token-1 -p ${CI_BUILD_TOKEN} ${CI_REGISTRY}"
  script:
      - docker pull $STAGE_TAG || true
      - docker build --cache-from $STAGE_TAG -t $STAGE_TAG .
      - docker push $STAGE_TAG