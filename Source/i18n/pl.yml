home:
  by: "Przez" 
  and: "i" 
  welcome: "Witamy w CanStaging<sup>+</sup>, opracowanym we współpracy pomiędzy Northern Ireland Cancer Registry (NICR), International Agency for Research on Cancer (IARC), Union for International Cancer Control (UICC) oraz Cancer Council Queensland (CCQ). Narzędzie to zostało zaprojektowane, aby poszerzyć dostępność, standaryzację i porównywalność klasyfikacji zaawansowania nowotworów na poziomie międzynarodowym. Narzędzie zapewnia automatyczne wyliczanie zaawansowania nowotworu według międzynarodowej klasyfikacji TNM w wersji 8 (wersja 7 dostępna jest w anglojęzycznej wersji narzędzia) dla różnych lokalizacji nowotworów – piersi, szyjki macicy, wątroby, płuc, przełyku, jajników, trzustki, prostaty i żołądka. Rak jelita grubego może być klasyfikowany za pomocą wersji TNM 5 w anglojęzycznej wersji narzędzia. Narzędzie zapewnia również automatyczne wyliczanie stopnia zaawansowania dla nowotworów dziecięcych przy użyciu zasad biznesowych opracowanych dla Toronto Paediatric Cancer Stage Guidelines. W przyszłości narzędzie będzie dostępne w kilku językach. <br /> <br /> Aby uzyskać więcej informacji na temat wytycznych dotyczących klasyfikacji zaawansowania używanych w tym narzędziu, prosimy odwiedzić <a href='https://www.uicc.org/resources/tnm' target='blank'>Zasoby TNM Union for International Cancer Control (UICC)</a> oraz dla klasyfikacji dziecięcej <a href='https://cancerqld.blob.core.windows.net/content/docs/childhood-cancer-staging-for-population-registries.pdf' target='blank'>Toronto Paediatric Cancer Stage Guidelines</a>. Polskie tłumaczenie zostało przygotowane przez Zespół: Irmina Michałek (Zakład Patologii Nowotworów, Narodowy Instytut Onkologii im. Marii Skłodowskiej-Curie, Warszawa, Polski Komitet UICC), Łukasz Taraszkiewicz (Wielkopolskie Biuro Rejestracji Nowotworów, Wielkopolskie Centrum Onkologii, Poznań), Maciej Trojanowski (Wielkopolskie Biuro Rejestracji Nowotworów, Wielkopolskie Centrum Onkologii, Poznań)"
