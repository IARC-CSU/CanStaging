home:
  by: "By" 
  and: "and" 
  welcome: "Welcome to CanStaging<sup>+</sup>, developed by a collaboration between the Northern Ireland Cancer Registry (NICR), the International Agency for Research on Cancer (IARC), the Union for International Cancer Control (UICC) ), and Cancer Council Queensland (CCQ). The tool is designed to help maximise the availability, standardisation and comparability of cancer staging internationally. The tool provides automatic calculation of the international TNM staging classification versions 7 and 8 for a variety of tumour sites – breast, cervix, liver, lung, oesophagus, ovary, pancreas, prostate and stomach. Colorectal cancer may be staged using the TNM staging versions 5 and 8. The Tool also provides automatic calculation of stage for childhood cancers using the business rules developed for the Toronto Paediatric Cancer Stage Guidelines. In the future, the tool will be available in several languages. <br /> <br /> For further information about the Staging Guidelines used in this tool, please refer to <a href='https://www.uicc.org/resources/tnm' target='blank'>The Union for International Cancer Control (UICC) TNM Resources</a> and for childhood staging the <a href='https://cancerqld.blob.core.windows.net/content/docs/childhood-cancer-staging-for-population-registries.pdf' target='blank'>Toronto Paediatric Cancer Stage Guidelines</a>."
  endorsed_by: "Endorsed by"
  log_in: "Log in"
  enter_key: "Enter your key."

