home:
  by: "による"
  and: "と"
  welcome: |
    Northern Ireland Cancer Registry (NICR)、国際がん研究機関 (IARC)、国際対がん連合 (UICC)、およびCancer Council Queensland (CCQ)の協力により開発されたCanStaging<sup>+</sup>へようこそ。このツールは、がんステージングの国際的な利用可能性、標準化、および比較可能性を最大限に高めることを目的としています。このツールは、乳房、子宮頸部、肝臓、肺、食道、卵巣、膵臓、前立腺、胃など、さまざまながん部位に対して、国際的なTNMステージング分類バージョン7および8の自動計算を提供します。大腸がんは、TNMステージングバージョン5および8を使用してステージングできます。また、このツールは、トロント小児がんステージガイドラインのために開発されたビジネスルールを使用して、小児がんのステージを自動計算します。将来的には、このツールは複数の言語で利用可能になる予定です。<br /> <br /> このツールで使用されているステージングガイドラインの詳細については、<a href='https://www.uicc.org/resources/tnm' target='blank'>国際対がん連合 (UICC) のTNMリソース</a>を、小児のステージングについては<a href='https://cancerqld.blob.core.windows.net/content/docs/childhood-cancer-staging-for-population-registries.pdf' target='blank'>トロント小児がんステージガイドライン</a>を参照してください。
  endorsed_by: "推奨"
  log_in: "ログイン"
  enter_key: "キーを入力してください。"

