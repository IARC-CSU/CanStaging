  help: "ヘルプ"
  help_text: |
    <b>ヘルプ</b><br>CanStaging<sup>+</sup> - がんステージングツールは、ユーザーが入力した生情報からTNM、ステージ、悪性度、およびその他の部位特異的なステージスコアを計算します。<br>詳細については、<a href=\"/media/StagingToolHelp.pdf\" target=\"new\">PDFガイドをダウンロード</a>してください。
  copyright_text: |
    <h2>著作権</h2><ul><li>CanStaging+のソースコードはIARC 2021の著作物です。オープンソースのGNU/GPLライセンスで公開されています。</li> <li>ビジネスルールファイルはNICR 2021の著作物であり、クリエイティブ・コモンズ BY-SAライセンスで公開されています。</li> <li>トロント小児がんステージガイドラインのビジネスルールファイルはCCQ 2021の著作物であり、クリエイティブ・コモンズ BY-SAライセンスで公開されています。</li><li>イラストはUICCの著作物です。</li></ul>
  about: "概要"
  disclaimer_text: |
    <h2>保証、免責事項、および責任制限</h2> <p>本ツールは、明示的または黙示的を問わず、商品性、特定目的への適合性、または非侵害の黙示的な保証または条件を含むがこれらに限定されない、いかなる種類の保証または条件もなく、「現状有姿で」提供されます。</p> <p>IARC、NICR、およびCCQは、本ツールにおける誤りや脱漏について一切の責任を負いません。</p> <p>いかなる場合においても、IARC、NICR、またはCCQは、情報の使用または性能に起因または関連して生じる、いかなる種類の特別、偶発的、間接的または結果的な損害、あるいは（1）提示された資料への信頼、（2）代替品の費用、（3）使用、データまたは利益の損失、（4）遅延または業務の中断、（5）およびいかなる責任理論から生じるものを含むがこれに限定されない、いかなる損害についても責任を負わないものとします。たとえIARC、NICR、またはCCQがそのような損害の可能性について知らされていたとしても同様です。</p> <p>本ツールには、技術的またはその他の不正確さが含まれる可能性があります。しかし、IARC、NICR、およびCCQは、更新を提供する義務を負いません。</p>
