home:
  by: "Da" 
  and: "e"
  welcome: "Benvenuto in CanStaging<sup>+</sup>, sviluppato grazie alla collaborazione tra il Northern Ireland Cancer Registry (NICR), l'Agenzia Internazionale per la Ricerca sul Cancro (IARC), la Union for International Cancer Control (UICC) e il Cancer Council Queensland (CCQ). Lo strumento è progettato per massimizzare la disponibilità, la standardizzazione e la comparabilità della stadiazione del cancro a livello internazionale. Lo strumento calcola automaticamente la classificazione internazionale TNM (versioni 7 e 8) per una varietà di sedi tumorali – mammella, cervice, fegato, polmone, esofago, ovaie, pancreas, prostata e stomaco. Il cancro colorettale può essere stadiato utilizzando le versioni 5 e 8 della classificazione TNM. Lo strumento fornisce anche il calcolo automatico dello stadio per i tumori pediatrici utilizzando le regole sviluppate per le Linee Guida sulla Stadiazione del Cancro Pediatrico di Toronto. In futuro, lo strumento sarà disponibile in diverse lingue. <br /> <br /> Per ulteriori informazioni sulle Linee Guida di Stadiazione utilizzate in questo strumento, si rimanda a <a href='https://www.uicc.org/resources/tnm' target='blank'>Le risorse TNM della Union for International Cancer Control (UICC)</a> e per la stadiazione pediatrica alle <a href='https://cancerqld.blob.core.windows.net/content/docs/childhood-cancer-staging-for-population-registries.pdf' target='blank'>Linee Guida sulla Stadiazione del Cancro Pediatrico di Toronto</a>."
