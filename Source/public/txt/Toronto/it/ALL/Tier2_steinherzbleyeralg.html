<html>
  <head>
        <!--  -->
	<script>
        function calculate(){
			var a,b,c,d,answer;
			a=Number(document.getElementById('wbc_cf').value);
			b=Number(document.getElementById('rbc_cf').value);
			c=Number(document.getElementById('wbc_b').value);
			d=Number(document.getElementById('rbc_b').value);
			answer = (a/b)/(c/d)
			document.getElementById('answer').value= answer;
		}
	</script>
  </head>
  <body>
  	Formula: WBC/RBC in cerebrospinal fluid ÷ WBC/RBC in blood
	<table>
		
		<thead></thead>
		<tbody>
			<tr><td>Enter WBC in cerebrospinal fluid:</td><td> <input id='wbc_cf' /></td></tr>
			<tr><td>Enter RBC in cerebrospinal fluid:</td><td> <input id='rbc_cf'></td></tr>
			<tr><td>Enter WBC in blood: </td><td><input id='wbc_b'></td></tr>
			<tr><td>Enter RBC in blood: </td><td><input id='rbc_b'></td></tr>
			<tr><td /><td><button onclick='calculate()'>Calculate</button></td></tr>
			<tr><td /><td><input readonly = 'readonly' id='answer'></td></tr>
		</tbody>
	</table>

  </body>
<html>
