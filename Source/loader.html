<!DOCTYPE html>
<html>

<head>
  <title>CanStaging<sup>+</sup>Loader</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    /* https://www.w3schools.com/howto/howto_css_loader.asp */
    /* Center the loader */
    #loader {
      position: absolute;
      left: 50%;
      top: 50%;
      z-index: 1;
      width: 150px;
      height: 150px;
      margin: -75px 0 0 -75px;
      border: 16px solid #f3f3f3;
      border-radius: 50%;
      border-top: 16px solid #3498db;
      width: 120px;
      height: 120px;
      -webkit-animation: spin 2s linear infinite;
      animation: spin 2s linear infinite;
    }

    @-webkit-keyframes spin {
      0% {
        -webkit-transform: rotate(0deg);
      }

      100% {
        -webkit-transform: rotate(360deg);
      }
    }

    @keyframes spin {
      0% {
        transform: rotate(0deg);
      }

      100% {
        transform: rotate(360deg);
      }
    }

    /* Add animation to "page content" */
    .animate-bottom {
      position: relative;
      -webkit-animation-name: animatebottom;
      -webkit-animation-duration: 3s;
      animation-name: animatebottom;
      animation-duration: 3s
    }

    @-webkit-keyframes animatebottom {
      from {
        bottom: -100px;
        opacity: 0
      }

      to {
        bottom: 0px;
        opacity: 1
      }
    }

    @keyframes animatebottom {
      from {
        bottom: -100px;
        opacity: 0
      }

      to {
        bottom: 0;
        opacity: 1
      }
    }

    body {
      font-family: sans-serif;
    }

    h2 {
      font-family: sans-serif;
    }

    #myDiv {
      display: block;
      text-align: center;
    }

    img {
      display: none;
    }
  </style>
  <script type="text/javascript">

    var server = "http://127.0.0.1:9292";
    var key = 'xyz'

    // https://stackoverflow.com/questions/5224197/javascript-check-if-server-is-online
    function ifServerOnline(ifOnline, ifOffline) {
      var img = document.body.appendChild(document.createElement("img"));
      img.onload = function () {
        if (typeof ifOnline === "function") {
          ifOnline();
        }
      };
      img.onerror = function () {
        if (typeof ifOffline === "function") {
          ifOffline();
        }
      };
      img.src = server + "/media/ping.gif?" + performance.now();
    }

    async function check() {
      ifServerOnline(
        function () {
          // Server online code here
          window.location = server + "/tool?key=" + key;
        },
        function () {
          // Server offline code here
          setTimeout(check, 1000);
        }
      );
    }

    document.addEventListener("DOMContentLoaded", function () {
      check();
    });
  </script>
</head>

<body>
  <div id="loader"></div>

  <div style="display:block;" id="myDiv" class="animate-bottom">
    <h2>CanStaging<sup>+</sup></h2>
    <p>Loading, please wait...</p>
  </div>
</body>

</html>
