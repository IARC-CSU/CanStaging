<!DOCTYPE html>
<html lang="en">
<head>
    <title>CanStaging+ Loader</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /* General Setup */
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            background-color: #f0f2f5;
            color: #333;
        }

        /* Centering container for all content */
        .container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* CSS Loader styles */
        #loader {
            width: 80px;
            height: 80px;
            border: 8px solid #f3f3f3;
            border-top: 8px solid #3498db;
            border-radius: 50%;
            animation: spin 1.5s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Content styles */
        #content {
            padding: 20px;
            animation: fadeIn 1s ease-in-out;
        }
        
        #timeout-message {
            display: none; /* Hidden by default */
            color: #d9534f;
            margin-top: 20px;
            animation: fadeIn 1s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div id="loader"></div>
        <main id="content">
            <h2>CanStaging<sup>+</sup></h2>
            <p>Loading, please wait...</p>
        </main>
        <div id="timeout-message">
            <p>The local service is taking a long time to start.</p>
            <p>Please ensure the service is running correctly and then refresh this page.</p>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // --- Configuration ---
            const SERVER_URL = "http://127.0.0.1:9292";
            const KEY = 'xyz';
            const REDIRECT_URL = `${SERVER_URL}/tool?key=${KEY}`;
            const PING_RESOURCE = `${SERVER_URL}/media/ping.gif`;
            const PING_INTERVAL_MS = 1000; // Check every 1 second
            const OVERALL_TIMEOUT_MS = 90000; // Give up after 90 seconds

            /**
             * Checks if the server is online by making a lightweight network request.
             * Returns true if online, false otherwise.
             */
            async function checkServerStatus() {
                try {
                    // Use fetch with 'no-cors' as we only need to know if the endpoint is reachable,
                    // not read the response. 'no-store' prevents caching.
                    await fetch(PING_RESOURCE, { mode: 'no-cors', cache: 'no-store' });
                    return true;
                } catch (error) {
                    // A TypeError indicates a network error (e.g., server is down)
                    return false;
                }
            }

            // Set a timeout to show an error message if the server doesn't start in time.
            const timeoutId = setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'none';
                document.getElementById('timeout-message').style.display = 'block';
                // Stop polling after timeout
                clearInterval(pollingInterval); 
            }, OVERALL_TIMEOUT_MS);

            // Start polling the server
            const pollingInterval = setInterval(async () => {
                const isOnline = await checkServerStatus();
                if (isOnline) {
                    // Server is up! Clear timers and redirect.
                    clearInterval(pollingInterval);
                    clearTimeout(timeoutId);
                    window.location.href = REDIRECT_URL;
                }
            }, PING_INTERVAL_MS);
        });
    </script>
</body>
</html>
